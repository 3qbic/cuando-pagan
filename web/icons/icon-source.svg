<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Favicon/ícono de «¿Cuándo Pagan?» — anillo esmeralda (countdown) + moneda dorada.
       Fuente editable; los PNG (favicon.png, Icon-*.png) se generan desde aquí con rsvg-convert. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13223C"/>
      <stop offset="1" stop-color="#070C14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12B98A"/>
      <stop offset="1" stop-color="#3BF0B4"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#FCEBBE"/>
      <stop offset="0.55" stop-color="#F4C868"/>
      <stop offset="1" stop-color="#D19A2E"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#25E6A4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#25E6A4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- pista tenue del anillo -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="44"/>
  <!-- anillo esmeralda (arco ~80%, con hueco arriba-izq, como el countdown del Home) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="44" stroke-linecap="round"
          stroke-dasharray="760 942" transform="rotate(-90 256 256)"/>
  <!-- moneda dorada -->
  <circle cx="256" cy="256" r="88" fill="url(#coin)"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <!-- signo $ -->
  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="120" fill="#0A150F">$</text>
</svg>
