<!DOCTYPE html>
<html>
<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App independiente y no oficial para consultar fechas de pago del sector público de Panamá.">
  <meta name="theme-color" content="#070C14">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="¿Cuándo Pagan?">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>¿Cuándo Pagan? — fechas de pago del sector público de Panamá (app no oficial)</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Auto-actualización: cuando el service worker nuevo toma control tras un
    // deploy, recarga la página UNA vez para servir la versión fresca (evita
    // el clásico "hay que refrescar dos veces" de Flutter web).
    if ('serviceWorker' in navigator) {
      var teniaControlador = !!navigator.serviceWorker.controller;
      var yaRecargo = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (teniaControlador && !yaRecargo) {
          yaRecargo = true;
          window.location.reload();
        }
      });
    }
  </script>
  <script>
    // Versión nueva al volver a la app: Android/iOS dejan la PWA instalada
    // dormida en memoria y al reabrirla no recargan. Al volver a primer plano
    // (y cada hora si sigue abierta) se compara version.json con la versión con
    // que arrancó; si cambió, se recarga. Así nadie se queda en una versión vieja.
    (function () {
      var inicial = null, ultimo = 0;
      function leer() {
        return fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { return j && (j.version + '+' + j.build_number); })
          .catch(function () { return null; });
      }
      leer().then(function (v) { inicial = v; ultimo = Date.now(); });
      function revisar() {
        if (!inicial || document.visibilityState !== 'visible' || Date.now() - ultimo < 60000) return;
        ultimo = Date.now();
        leer().then(function (v) { if (v && v !== inicial) window.location.reload(); });
      }
      document.addEventListener('visibilitychange', revisar);
      setInterval(revisar, 3600000);
    })();
  </script>
  <script>
    // Aviso "instala la app": guarda el prompt de Chrome Android y expone el
    // estado a Flutter (lib/core/pwa/pwa_web.dart). Sin rastreo: nada sale del navegador.
    (function () {
      var promptGuardado = null;
      var subs = [];
      function avisar() { subs.forEach(function (f) { try { f(); } catch (e) {} }); }
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); promptGuardado = e; avisar(); });
      window.addEventListener('appinstalled', function () { promptGuardado = null; avisar(); });
      window.cpPwaAlCambiar = function (f) { subs.push(f); };
      window.cpPwaEstado = function () {
        var ua = navigator.userAgent || '';
        var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        if (standalone) return 'standalone';
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (ios) return 'ios';
        if (/Android/i.test(ua)) return promptGuardado ? 'android-prompt' : 'android';
        return 'otro';
      };
      window.cpPwaInstalar = function () {
        if (!promptGuardado) return Promise.resolve(false);
        var p = promptGuardado; promptGuardado = null;
        p.prompt();
        return p.userChoice.then(function (r) { return r && r.outcome === 'accepted'; }, function () { return false; });
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
