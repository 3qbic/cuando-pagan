name = "calendario-pago-pa"
main = "src/index.js"
compatibility_date = "2026-06-26"

# Worker Route: solo /v1/* del dominio de la app; la SPA y /privacidad/ siguen en Pages.
routes = [{ pattern = "cuandopagan.3qbic.com/v1/*", zone_name = "3qbic.com" }]

# JSON se importa como modulo (esbuild lo empaqueta como objeto; NO agregar una
# regla "Text" para *.json: lo volveria string y el Worker no arranca).
# No requiere KV ni R2. Datos generados por pipeline/build_dataset.py -> worker/src/data/*.json

# Observabilidad gratis
[observability]
enabled = true
# Privacidad: sin registros por invocación (guardarían IP y user-agent de cada
# apertura 3 días); se conservan solo los console.log.
[observability.logs]
invocation_logs = false

# Cron Trigger (gratis): revisa el MEF cada lunes 12:00 UTC.
[triggers]
crons = ["0 12 * * 1"]

# Metricas agregadas (sin IP ni ID). Esquema en src/metricas.js.
[[analytics_engine_datasets]]
binding = "USO"
dataset = "cuandopagan_uso"

# KV OPCIONAL: si lo activas, el cron guarda el resultado y /v1/status lo sirve
# sin re-consultar el MEF. Sin KV, /v1/status hace el chequeo en vivo igual.
# Para activarlo:
#   npx wrangler kv namespace create MEF_KV
#   pega el id devuelto abajo y descomenta:
# [[kv_namespaces]]
# binding = "MEF_KV"
# id = "PEGAR_ID_AQUI"

# --- Despliegue ---
# 1) npm install
# 2) python ../pipeline/build_dataset.py   (regenera worker/src/data/)
# 3) npx wrangler deploy
# URL final: el Worker se sirve en https://cuandopagan.3qbic.com/v1/* mediante la Route
# (la URL por defecto de workers.dev tambien puede existir).
